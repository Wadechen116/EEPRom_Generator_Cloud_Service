<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EEPROM Generator cloud service</title>
<!-- ?v= is a manual cache-buster: bump it whenever style.css/app.js/etc. change and
     the browser (or an intermediary cache) might otherwise keep serving the old
     file. Without it, a redeploy can silently not take effect for visitors who
     already loaded the page once -- this bit us twice while debugging the Items
     layout. Keep every ?v= below in sync when you bump one. -->
<link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body>

<div id="particles-bg" aria-hidden="true"></div>

<header class="site-header">
    <div class="container header-inner">
        <div>
            <h1>EEPROM Generator cloud service</h1>
            <p class="subtitle">Sensor / config-file records, backed by the REST API in <code>api/eeprom_config.php</code></p>
        </div>
        <div class="user-box" id="userBox" hidden>
            <span id="userAccountLabel"></span>
            <button type="button" class="btn btn-outline" id="logoutBtn">Logout</button>
        </div>
    </div>
</header>

<main class="container">
    <section class="panel" id="loginPanel">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="field">
                <label for="loginAccount">Account</label>
                <input type="text" id="loginAccount" required autocomplete="username">
            </div>
            <div class="field">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required autocomplete="current-password">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn" id="loginBtn">Login</button>
            </div>
        </form>
        <p class="form-message" id="loginMessage" role="status"></p>
    </section>

    <div id="appContent" hidden>
        <div class="items-layout">
            <section class="panel">
                <div class="panel-header">
                    <h2>Items <span id="itemsTotal" class="items-total"></span></h2>
                    <div class="panel-header-actions">
                        <button type="button" class="btn" id="addItemBtn">Add Item</button>
                        <button type="button" class="btn btn-outline" id="refreshBtn">Refresh</button>
                    </div>
                </div>

                <div class="panel-toolbar">
                    <input type="search" id="searchBox" class="search-box" placeholder="Search file name, format, mode...">
                </div>

                <div class="table-wrap">
                    <table id="itemsTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>File Name</th>
                                <th>Content</th>
                                <th>Comment</th>
                                <th>File Format</th>
                                <th>FPS</th>
                                <th>MHz</th>
                                <th>isPGL</th>
                                <th>Output Format</th>
                                <th>Support Mode</th>
                                <th>Account</th>
                                <th>Modified</th>
                                <th class="col-actions"></th>
                            </tr>
                        </thead>
                        <tbody id="itemsBody">
                            <tr><td colspan="13" class="empty">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="pagination"></div>
            </section>

            <aside class="items-side-rail">
                <div class="tag-cloud" id="tagCloud"></div>
                <div class="fish-tank" id="fishTank" aria-hidden="true"></div>
            </aside>
        </div>
    </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<dialog id="itemDialog">
    <h2 id="formTitle">Add Item</h2>
    <form id="itemForm">
        <input type="hidden" id="itemIndex" value="">

        <div class="field-grid">
            <!-- Fixed value domains: the desktop tool syncs this table and stores
                 the same values, so a free-text field here would make rows flip
                 back and forth. api/eeprom_config.php enforces the same lists. -->
            <div class="field">
                <label for="file_format">File Format</label>
                <select id="file_format" required>
                    <option value="">(not set)</option>
                    <option value="INI">INI</option>
                    <option value="BIN">BIN</option>
                </select>
            </div>
            <div class="field">
                <label for="fps">FPS</label>
                <input type="text" id="fps" required maxlength="50">
            </div>
            <div class="field">
                <label for="file_name">File Name</label>
                <input type="text" id="file_name" required maxlength="150">
            </div>
            <div class="field">
                <label for="MHz">MHz</label>
                <input type="text" id="MHz" required maxlength="50">
            </div>
            <div class="field">
                <label for="output_format">Output Format</label>
                <select id="output_format" required>
                    <option value="">(not set)</option>
                    <option value="AHD">AHD</option>
                    <option value="YUV422">YUV422</option>
                </select>
            </div>
            <div class="field">
                <label for="support_mode">Support Mode</label>
                <select id="support_mode" required>
                    <option value="">(not set)</option>
                    <option value="Master">Master</option>
                    <option value="Slave">Slave</option>
                </select>
            </div>
            <div class="field field-checkbox">
                <label><input type="checkbox" id="isPGL" checked> isPGL</label>
            </div>
        </div>

        <div class="field">
            <label for="contentFile">Load from file (optional)</label>
            <!-- Fills file_name, file_format and content from a local file. A
                 .bin is converted to hex text here, because that is what the
                 column holds: MySQL TEXT cannot carry raw bytes, and the
                 desktop tool stores the same hex. -->
            <input type="file" id="contentFile" accept=".ini,.bin,.txt">
        </div>

        <div class="field">
            <label for="content">Content <span class="hint" id="contentHint"></span></label>
            <textarea id="content" rows="6" required></textarea>
        </div>

        <div class="field">
            <!-- What this version is for. There is no "account" field here on
                 purpose: the server stamps that from the logged-in account on
                 every save, so an input for it could only ever be a lie. -->
            <label for="comment">Comment <span class="hint">what this version is for &mdash; production, sample, test, what changed</span></label>
            <textarea id="comment" rows="2" maxlength="1000"></textarea>
        </div>

        <details class="ext-fields">
            <summary>Extension fields (optional)</summary>
            <div class="field-grid">
                <div class="field">
                    <label for="ext_str1">ext_str1</label>
                    <input type="text" id="ext_str1" maxlength="100">
                </div>
                <div class="field">
                    <label for="ext_str2">ext_str2</label>
                    <input type="text" id="ext_str2" maxlength="255">
                </div>
                <div class="field">
                    <label for="ext_int1">ext_int1</label>
                    <input type="number" id="ext_int1" step="1">
                </div>
            </div>
            <div class="field">
                <label for="ext_txt1">ext_txt1</label>
                <textarea id="ext_txt1" rows="2"></textarea>
            </div>
            <div class="field">
                <label for="ext_txt2">ext_txt2</label>
                <textarea id="ext_txt2" rows="2"></textarea>
            </div>
            <div class="field">
                <label for="ext_txt3">ext_txt3</label>
                <textarea id="ext_txt3" rows="2"></textarea>
            </div>
            <div class="field">
                <label for="ext_txt4">ext_txt4</label>
                <textarea id="ext_txt4" rows="2"></textarea>
            </div>
            <div class="field">
                <label for="ext_txt5">ext_txt5</label>
                <textarea id="ext_txt5" rows="2"></textarea>
            </div>
        </details>

        <div class="form-actions">
            <button type="submit" class="btn" id="submitBtn">Save</button>
            <button type="button" class="btn btn-outline" id="cancelEditBtn">Cancel</button>
        </div>
    </form>
    <p class="form-message" id="formMessage" role="status"></p>
</dialog>

<footer class="site-footer">
    <div class="container">
        <p>&copy; <span id="year"></span> SOINC Software team</p>
    </div>
</footer>

<script src="assets/js/vendor/particles.min.js"></script>
<script src="assets/js/particles-bg.js?v=2"></script>
<script src="assets/js/vendor/p5.min.js"></script>
<script src="assets/js/fish.js?v=2"></script>
<script src="assets/js/tagcloud3d.js?v=2"></script>
<script src="assets/js/app.js?v=3"></script>
</body>
</html>
